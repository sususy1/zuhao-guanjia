<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1677ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="租号管家">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>租号管家</title>
<script src="lib/vue.global.prod.js"></script>
<script src="lib/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f6fa;font-size:14px;color:#323233}
#app{min-height:100vh;padding-bottom:60px}
.page-header{background:linear-gradient(135deg,#1989fa,#07c160);color:#fff;padding:20px 16px 24px}
.page-header .title{font-size:20px;font-weight:600;margin-bottom:4px}
.page-header .subtitle{font-size:13px;opacity:.85}
.card{background:#fff;border-radius:12px;margin:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat-item{background:#f7f8fa;border-radius:10px;padding:14px;text-align:center}
.stat-item .v{font-size:22px;font-weight:700;margin-bottom:4px}
.stat-item .l{font-size:12px;color:#969799}
.stat-item.primary .v{color:#1989fa}.stat-item.success .v{color:#07c160}
.stat-item.warning .v{color:#ff976a}.stat-item.danger .v{color:#ee0a24}
.status-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.status-tag.online{background:#e8f7ee;color:#07c160}
.status-tag.offline{background:#f2f3f5;color:#969799}
.status-tag.error{background:#fef0f0;color:#ee0a24}
.status-tag.on_shelf{background:#e8f7ee;color:#07c160}
.status-tag.off_shelf{background:#f2f3f5;color:#969799}
.status-tag.rented{background:#e8f3ff;color:#1989fa}
.status-tag.completed{background:#e8f7ee;color:#07c160}
.status-tag.ongoing{background:#e8f3ff;color:#1989fa}
.status-tag.pending{background:#fff7e8;color:#ff976a}
.status-tag.cancelled{background:#f2f3f5;color:#969799}
.status-tag.abnormal{background:#fef0f0;color:#ee0a24}
.account-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.account-card .acct-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.account-card .acct-name{font-size:15px;font-weight:600}
.account-card .acct-user{font-size:12px;color:#969799;margin-bottom:8px}
.account-card .acct-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.account-card .acct-meta span{font-size:11px;color:#969799;background:#f7f8fa;padding:2px 6px;border-radius:4px}
.account-card .acct-actions{display:flex;gap:8px}
.order-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.order-card .order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #f2f3f5}
.order-card .order-title{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.order-card .order-row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.order-card .order-row .label{color:#969799}
.order-card .order-row .income{color:#07c160;font-weight:600}
.order-card .order-id{margin-top:8px;font-size:11px;color:#c8c9cc}
.order-card .flag{margin-top:8px;padding:6px 10px;background:#fef0f0;color:#ee0a24;border-radius:6px;font-size:12px}
.listing-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f2f3f5}
.listing-item:last-child{border-bottom:none}
.listing-item .li-info{flex:1;min-width:0}
.listing-item .li-title{font-size:14px;font-weight:500;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listing-item .li-meta{font-size:11px;color:#969799;display:flex;gap:8px;flex-wrap:wrap}
.listing-item .li-account{font-size:11px;color:#1989fa;background:#e8f3ff;padding:2px 8px;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-top:4px}
.listing-item .li-account:hover{background:#d0e8ff}
.listing-item .li-conflict{font-size:11px;color:#ee0a24;background:#fef0f0;padding:2px 8px;border-radius:4px;margin-top:4px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.listing-item .li-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:10px}
.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick-actions .qa-item{text-align:center;padding:12px 4px;background:#f7f8fa;border-radius:8px;cursor:pointer}
.quick-actions .qa-item:active{transform:scale(.95)}
.quick-actions .qa-icon{font-size:28px;margin-bottom:6px}
.quick-actions .qa-text{font-size:12px}
.empty-state{text-align:center;padding:60px 20px;color:#969799;font-size:14px}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.login-page{min-height:100vh;background:linear-gradient(180deg,#1989fa 0%,#f5f6fa 40%);padding:60px 0 40px}
.login-header{text-align:center;color:#fff;margin-bottom:40px}
.login-header .logo{font-size:64px;margin-bottom:16px}
.login-header h1{font-size:24px;font-weight:700;margin-bottom:8px}
.login-header p{font-size:14px;opacity:.85}
.login-btn{margin:24px 16px 0}
.login-tip{text-align:center;margin-top:24px;color:#969799;font-size:12px;line-height:1.8}
.chart-container{width:100%;height:220px}
.avg-row{display:flex;justify-content:space-around;margin-top:16px;padding-top:16px;border-top:1px solid #f2f3f5}
.avg-row .avg-item{text-align:center}
.avg-row .avg-label{font-size:12px;color:#969799;margin-bottom:4px;display:block}
.avg-row .avg-value{font-size:16px;font-weight:600}
.user-card{display:flex;align-items:center;gap:14px;margin-top:-16px}
.user-card .avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1989fa,#07c160);display:flex;align-items:center;justify-content:center;font-size:28px}
.user-card .uname{font-size:18px;font-weight:600;margin-bottom:4px}
.user-card .urole{font-size:12px;opacity:.85}
.platform-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.platform-grid .pg-item{text-align:center;padding:10px 4px;background:#f7f8fa;border-radius:8px}
.platform-grid .pg-icon{font-size:28px;margin-bottom:4px}
.platform-grid .pg-name{font-size:12px;margin-bottom:4px}
.tabbar{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;display:flex;border-top:1px solid #ebedf0;z-index:999}
.tabbar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:6px 0}
.tabbar-item.active{color:#1989fa}
.tabbar-item:not(.active){color:#969799}
.tabbar-icon{font-size:22px;margin-bottom:2px}
.tabbar-text{font-size:11px}
.fab-btn{position:fixed;right:20px;bottom:80px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1989fa,#07c160);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(25,137,250,.4);cursor:pointer;z-index:998}
.fab-btn:active{transform:scale(.92)}
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:flex-end}
.modal-box{background:#fff;width:100%;border-radius:16px 16px 0 0;max-height:85vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #ebedf0;font-size:16px;font-weight:600}
.modal-close{font-size:22px;color:#969799;cursor:pointer;padding:0 8px}
.btn{display:inline-block;padding:10px 20px;border-radius:8px;font-size:14px;text-align:center;cursor:pointer;border:none;outline:none}
.btn-primary{background:#1989fa;color:#fff}
.btn-success{background:#07c160;color:#fff}
.btn-warning{background:#ff976a;color:#fff}
.btn-danger{background:#ee0a24;color:#fff}
.btn-plain{background:transparent;border:1px solid currentColor}
.btn-block{display:block;width:100%}
.btn-mini{padding:4px 12px;font-size:12px;border-radius:6px}
.form-input{width:100%;padding:12px;border:1px solid #ebedf0;border-radius:8px;font-size:14px;outline:none;background:#f7f8fa}
.form-input:focus{border-color:#1989fa;background:#fff}
.clickable{cursor:pointer}
.clickable:active{opacity:.8}
.group-card{background:#fff;border-radius:12px;margin:12px;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.04);overflow:hidden}
.group-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer}
.group-head:active{background:#f7f8fa}
.group-head .gh-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.group-head .gh-account{font-size:15px;font-weight:600}
.group-head .gh-meta{font-size:11px;color:#969799;margin-top:2px}
.group-head .gh-right{display:flex;align-items:center;gap:8px}
.group-head .gh-arrow{font-size:18px;color:#969799;transition:transform .2s}
.group-head .gh-arrow.open{transform:rotate(90deg)}
.group-body{border-top:1px solid #f2f3f5;padding:0 16px}
.group-platform-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;margin-right:6px}
.group-platform-tag.mima{background:#fff0e6;color:#ff976a}
.group-platform-tag.uhaozu{background:#e8f3ff;color:#1989fa}
.group-conflict-badge{font-size:11px;color:#ee0a24;background:#fef0f0;padding:2px 8px;border-radius:4px;animation:pulse 1.5s infinite}
.filter-section{background:#fff;margin:0 12px 12px;border-radius:12px;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.filter-row{display:flex;align-items:center;margin-bottom:8px}
.filter-row:last-child{margin-bottom:0}
.filter-label{font-size:13px;color:#646566;width:50px;flex-shrink:0}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.filter-chip-item{padding:4px 12px;border-radius:16px;font-size:12px;background:#f2f3f5;color:#646566;cursor:pointer;white-space:nowrap}
.filter-chip-item.active{background:#1989fa;color:#fff}
.filter-chip-item:active{opacity:.8}
</style>
</head>
<body>
<div id="app">
  <!-- 登录页 -->
  <div v-if="page==='login'" class="login-page">
    <div class="login-header">
      <div class="logo">☁️</div>
      <h1>租号管家</h1>
      <p>多平台自动上下架 · 智能托管</p>
    </div>
    <div style="padding:0 16px">
      <div style="background:#fff;border-radius:12px;padding:4px 16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)">
        <div style="display:flex;align-items:center;border-bottom:1px solid #f2f3f5;padding:14px 0">
          <span style="width:60px;font-size:14px;color:#323233">用户名</span>
          <input v-model="loginForm.username" type="text" placeholder="请输入用户名" style="flex:1;border:none;outline:none;font-size:14px;background:transparent" />
        </div>
        <div style="display:flex;align-items:center;padding:14px 0">
          <span style="width:60px;font-size:14px;color:#323233">密码</span>
          <input v-model="loginForm.password" type="password" placeholder="请输入密码" style="flex:1;border:none;outline:none;font-size:14px;background:transparent" />
        </div>
      </div>
      <div class="login-btn">
        <button class="btn btn-primary btn-block" style="padding:14px;border-radius:24px;font-size:16px" :disabled="loginLoading" @click="doLogin">{{loginLoading?'登录中...':'登 录'}}</button>
      </div>
      <div class="login-tip">
        <p>默认账号：admin / admin123</p>
        <p>首次使用请在设置中修改密码</p>
      </div>
    </div>
  </div>

  <!-- 主界面 -->
  <template v-else>
    <!-- 首页 -->
    <div v-if="page==='home'">
      <div class="page-header">
        <div class="title">☁️ 租号管家</div>
        <div class="subtitle">{{ todayStr }} · 智能托管运行中</div>
      </div>
      <div class="card" style="margin-top:-16px">
        <div class="card-title"><span>📊 今日概览</span><span style="font-size:13px;color:#1989fa" @click="loadOverview">刷新</span></div>
        <div class="stat-grid">
          <div class="stat-item success"><div class="v">¥{{overview.today_income}}</div><div class="l">今日收益</div></div>
          <div class="stat-item primary"><div class="v">{{overview.today_orders}}</div><div class="l">今日订单</div></div>
          <div class="stat-item warning"><div class="v">{{overview.today_hours}}h</div><div class="l">出租时长</div></div>
          <div class="stat-item"><div class="v">{{overview.online_accounts}}/{{overview.total_accounts}}</div><div class="l">在线账号</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">📈 收益汇总</div>
        <div class="stat-grid">
          <div class="stat-item"><div class="v" style="font-size:18px">¥{{overview.week_income}}</div><div class="l">本周 ({{overview.week_orders}}单)</div></div>
          <div class="stat-item"><div class="v" style="font-size:18px">¥{{overview.month_income}}</div><div class="l">本月 ({{overview.month_orders}}单)</div></div>
        </div>
      </div>
      <div class="card clickable" @click="goPage('accountGroups')">
        <div class="card-title">🎮 商品状态</div>
        <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
          <div class="stat-item success"><div class="v">{{overview.on_shelf_listings}}</div><div class="l">上架中</div></div>
          <div class="stat-item"><div class="v">{{overview.total_game_accounts}}</div><div class="l">游戏账号 ›</div></div>
          <div class="stat-item"><div class="v">{{overview.total_listings}}</div><div class="l">商品总数</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">⚡ 快捷操作</div>
        <div class="quick-actions">
          <div class="qa-item" @click="goPage('accounts')"><div class="qa-icon">➕</div><div class="qa-text">添加账号</div></div>
          <div class="qa-item" @click="syncAll"><div class="qa-icon">🔄</div><div class="qa-text">全部同步</div></div>
          <div class="qa-item" @click="goPage('orders')"><div class="qa-icon">📋</div><div class="qa-text">查看订单</div></div>
          <div class="qa-item" @click="goPage('stats')"><div class="qa-icon">📉</div><div class="qa-text">数据统计</div></div>
        </div>
      </div>
    </div>

    <!-- 账号管理 -->
    <div v-if="page==='accounts'">
      <div class="page-header"><div class="title">账号管理</div><div class="subtitle">共 {{accounts.length}} 个账号 · 在线 {{accounts.filter(a=>a.status==='online').length}} 个</div></div>
      <div v-if="accounts.length" style="padding:0 12px">
        <div v-for="acc in accounts" :key="acc.id" class="account-card" @click="openAccount(acc)">
          <div class="acct-head">
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:20px">{{getPlatformIcon(acc.platform)}}</span>
              <span style="font-size:14px;font-weight:600">{{getPlatformName(acc.platform)}}</span>
            </div>
            <span :class="['status-tag',acc.status]">{{getStatusText(acc.status)}}</span>
          </div>
          <div class="acct-name">{{acc.nickname||acc.platform_username}}</div>
          <div class="acct-user">{{acc.platform_username}}</div>
          <div class="acct-meta">
            <span>📁 {{acc.group_name}}</span>
            <span>⏰ {{acc.onshelf_start_time}}-{{acc.onshelf_end_time}}</span>
            <span :style="acc.auto_manage?'color:#07c160':''">{{acc.auto_manage?'🤖 托管中':'手动'}}</span>
          </div>
          <div v-if="acc.error_message" style="font-size:12px;color:#ee0a24;background:#fef0f0;padding:6px 10px;border-radius:6px;margin-bottom:10px">⚠️ {{acc.error_message}}</div>
          <div class="acct-actions" @click.stop>
            <button class="btn btn-mini btn-primary btn-plain" style="color:#1989fa" @click="loginAccount(acc)">登录</button>
            <button class="btn btn-mini btn-success btn-plain" style="color:#07c160" @click="syncAccount(acc)">同步</button>
            <button class="btn btn-mini btn-plain" style="color:#ff976a" @click="toggleManage(acc)">{{acc.auto_manage?'停托管':'开托管'}}</button>
          </div>
        </div>
      </div>
      <div v-else class="empty-state"><div class="icon">📭</div><p>暂无账号，点击右下角按钮添加</p></div>
      <div class="fab-btn" @click="showAddAccount=true">+</div>
    </div>

    <!-- 账号详情 -->
    <div v-if="page==='accountDetail' && currentAccount">
      <div class="navbar">
        <span class="nav-back" @click="goPage('accounts')">‹ 返回</span>
        <span class="nav-title">账号详情</span>
      </div>
      <div class="card">
        <div class="card-title">
          <span>{{getPlatformIcon(currentAccount.platform)}} {{getPlatformName(currentAccount.platform)}}</span>
          <span :class="['status-tag',currentAccount.status]">{{getStatusText(currentAccount.status)}}</span>
        </div>
        <div class="cell-row"><span class="cell-label">备注名</span><span class="cell-value">{{currentAccount.nickname||'-'}}</span></div>
        <div class="cell-row"><span class="cell-label">平台账号</span><span class="cell-value">{{currentAccount.platform_username}}</span></div>
        <div class="cell-row"><span class="cell-label">分组</span><span class="cell-value">{{currentAccount.group_name}}</span></div>
        <div class="cell-row"><span class="cell-label">自动托管</span><span class="cell-value">{{currentAccount.auto_manage?'开启':'关闭'}}</span></div>
        <div class="cell-row"><span class="cell-label">托管时段</span><span class="cell-value">{{currentAccount.onshelf_start_time}} - {{currentAccount.onshelf_end_time}}</span></div>
        <div class="cell-row"><span class="cell-label">最后同步</span><span class="cell-value">{{currentAccount.last_sync_time?formatTime(currentAccount.last_sync_time):'从未同步'}}</span></div>
        <div style="display:flex;gap:10px;padding:16px;justify-content:center">
          <button class="btn btn-primary" style="padding:8px 20px;border-radius:8px;font-size:14px" @click="loginAccount(currentAccount)">登录</button>
          <button class="btn btn-success" style="padding:8px 20px;border-radius:8px;font-size:14px" @click="syncAccount(currentAccount)">同步</button>
          <button class="btn btn-danger" style="padding:8px 20px;border-radius:8px;font-size:14px" @click="deleteAccount(currentAccount)">删除</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title"><span>🎮 出租商品 ({{listings.length}})</span><span style="display:flex;gap:12px;font-size:13px"><span style="color:#ee0a24" @click="runConflictCheck">⚠️ 冲突检测</span><span style="color:#1989fa" @click="loadListings">刷新</span></span></div>
        <div v-if="listings.length">
          <div v-for="item in listings" :key="item.id" class="listing-item">
            <div class="li-info">
              <div class="li-title">{{item.title}}</div>
              <div class="li-meta"><span>{{item.game_name||'-'}}</span><span>¥{{item.price_per_hour}}/时</span><span>租{{item.total_rentals}}次</span></div>
              <div v-if="item.account_identifier" class="li-account" @click="editAccountId(item)">🔑 {{item.account_identifier}} <span style="opacity:.6">✎</span></div>
              <div v-else class="li-account" @click="editAccountId(item)" style="background:#f2f3f5;color:#969799">➕ 设置账号标识</div>
              <div v-if="isConflict(item)" class="li-conflict">⚠️ 跨平台冲突：该账号在其他平台也在售</div>
            </div>
            <div class="li-right">
              <span :class="['status-tag',item.status]">{{getListingStatusText(item.status)}}</span>
              <button v-if="item.status==='off_shelf'" class="btn btn-mini btn-success" style="padding:4px 14px;border-radius:6px;font-size:12px" @click="listingAction(item,'onshelf')">上架</button>
              <button v-else class="btn btn-mini" style="padding:4px 14px;border-radius:6px;font-size:12px;background:#ff976a;color:#fff" @click="listingAction(item,'offshelf')">下架</button>
            </div>
          </div>
        </div>
        <div v-else class="empty-state" style="padding:30px">暂无商品，请先同步</div>
      </div>
    </div>

    <!-- 商品总览（按账号分组） -->
    <div v-if="page==='accountGroups'">
      <div class="navbar">
        <span class="nav-back" @click="goPage('home')">‹ 返回</span>
        <span class="nav-title">商品总览</span>
        <span style="font-size:13px;color:#1989fa" @click="loadAccountGroups">刷新</span>
      </div>

      browserSessionId.value = '';
    }

    async function startBrowserLogin(platform) {
      browserPlatform.value = platform;
      browserLoading.value = true;
      browserLoadingText.value = '正在打开登录页...';
      try {
        const res = await fetch('/api/browser/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ platform })
        });
        const data = await res.json();
        if (data.session_id) {
          browserSessionId.value = data.session_id;
          browserScreenshot.value = 'data:image/png;base64,' + data.screenshot;
          showToast('登录页已打开，请在截图上操作登录');
        } else {
          showToast('打开失败: ' + (data.detail || '未知错误'));
        }
      } catch(e) {
        showToast('打开失败: ' + e);
      }
      browserLoading.value = false;
    }

    async function browserClick(e) {
      if (!browserSessionId.value) return;
      const container = document.getElementById('browser-img-container');
      const img = document.getElementById('browser-screenshot-img');
      if (!container || !img) return;
      const cRect = container.getBoundingClientRect();
      const relX = e.clientX - cRect.left + container.scrollLeft;
      const relY = e.clientY - cRect.top + container.scrollTop;
      const scaleX = img.naturalWidth / (cRect.width * browserZoom.value);
      const scaleY = img.naturalHeight / (cRect.height * browserZoom.value);
      const x = Math.round(relX * scaleX);
      const y = Math.round(relY * scaleY);
      browserLoading.value = true;
      browserLoadingText.value = '点击中...';
      try {
        const res = await fetch('/api/browser/session/' + browserSessionId.value + '/click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ x, y })
        });
        const data = await res.json();
        if (data.screenshot) browserScreenshot.value = 'data:image/png;base64,' + data.screenshot;
      } catch(e) {
        showToast('点击失败: ' + e);
      }
      browserLoading.value = false;
    }

    async function browserType() {
      if (!browserSessionId.value || !browserInputText.value) return;
      browserLoading.value = true;
      browserLoadingText.value = '输入中...';
      try {
        const res = await fetch('/api/browser/session/' + browserSessionId.value + '/type', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ text: browserInputText.value })
        });
        const data = await res.json();
        if (data.screenshot) browserScreenshot.value = 'data:image/png;base64,' + data.screenshot;
        browserInputText.value = '';
      } catch(e) {
        showToast('输入失败: ' + e);
      }
      browserLoading.value = false;
    }

    async function browserPressKey(key) {
      if (!browserSessionId.value) return;
      browserLoading.value = true;
      browserLoadingText.value = '按键中...';
      try {
        const res = await fetch('/api/browser/session/' + browserSessionId.value + '/press-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ key })
        });
        const data = await res.json();
        if (data.screenshot) browserScreenshot.value = 'data:image/png;base64,' + data.screenshot;
      } catch(e) {
        showToast('按键失败: ' + e);
      }
      browserLoading.value = false;
    }

    async function browserRefresh() {
      if (!browserSessionId.value) return;
      browserLoading.value = true;
      browserLoadingText.value = '刷新中...';
      try {
        const res = await fetch('/api/browser/session/' + browserSessionId.value + '/screenshot', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (data.screenshot) browserScreenshot.value = 'data:image/png;base64,' + data.screenshot;
      } catch(e) {
        showToast('刷新失败: ' + e);
      }
      browserLoading.value = false;
    }

    function browserZoomIn() { browserZoom.value = Math.min(browserZoom.value + 0.25, 3.0); }
    function browserZoomOut() { browserZoom.value = Math.max(browserZoom.value - 0.25, 0.5); }

    async function confirmBrowserLogin() {
      if (!browserSessionId.value) return;
      if (!confirm('确认已经登录成功了吗？确认后系统会自动保存登录凭证并开始同步数据。')) return;
      browserLoading.value = true;
      browserLoadingText.value = '保存登录凭证...';
      try {
        const res = await fetch('/api/browser/session/' + browserSessionId.value + '/confirm-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ nickname: browserPlatform.value + '账号', group_name: '默认分组' })
        });
        const data = await res.json();
        if (data.success) {
          showToast('登录成功！已开始同步数据');
          showBrowserLogin.value = false;
          browserSessionId.value = '';
          loadAll();
        } else {
          showToast(data.detail || '保存失败');
        }
      } catch(e) {
        showToast('保存失败: ' + e);
      }
      browserLoading.value = false;
    }

    function closeBrowserLogin() {
      if (browserSessionId.value) {
        fetch('/api/browser/session/' + browserSessionId.value, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        }).catch(()=>{});
      }
      showBrowserLogin.value = false;
      browserSessionId.value = '';
    }

    const toastMsg = ref('');
    let toastTimer = null;
    function showToast(msg) {
      toastMsg.value = msg;
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>{ toastMsg.value = ''; }, 2000);
    }

    const confirmShow = ref(false);
    const confirmTitle = ref('');
    const confirmMsg = ref('');
    let confirmCallback = null;
    function showConfirm(title, msg) {
      return new Promise((resolve) => {
        confirmTitle.value = title;
        confirmMsg.value = msg;
        confirmShow.value = true;
        confirmCallback = resolve;
      });
    }
    function confirmResolve(val) {
      confirmShow.value = false;
      if (confirmCallback) { confirmCallback(val); confirmCallback = null; }
    }

    const todayStr = new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
    const filteredOrders = computed(() => orders.value.filter(o => !orderFilter.status || o.status === orderFilter.status));

    function parseGameName(gameName) {
      if (!gameName) return { game: '未知', partition: '无区服' };
      const parts = gameName.trim().split(/\s+/);
      if (parts.length >= 2) {
        return { game: parts[0], partition: parts.slice(1).join(' ') };
      }
      return { game: parts[0], partition: '无区服' };
    }

    const gameOptions = computed(() => {
      const games = new Set();
      for (const g of accountGroups.value) {
        for (const item of g.listings) {
          games.add(parseGameName(item.game_name).game);
        }
      }
      return Array.from(games).sort();
    });

    const partitionOptions = computed(() => {
      const parts = new Set();
      for (const g of accountGroups.value) {
        for (const item of g.listings) {
          const p = parseGameName(item.game_name).partition;
          if (p && p !== '无区服') parts.add(p);
        }
      }
      return Array.from(parts).sort();
    });

    const platformOptions = computed(() => {
      return platforms.value.filter(p => p.supported).map(p => ({ key: p.key, name: p.name }));
    });

    const filteredAccountGroups = computed(() => {
      if (!groupFilter.game && !groupFilter.partition && !groupFilter.status && !groupFilter.platform) return accountGroups.value;
      return accountGroups.value.map(g => {
        const filtered = g.listings.filter(item => {
          const parsed = parseGameName(item.game_name);
          if (groupFilter.game && parsed.game !== groupFilter.game) return false;
          if (groupFilter.partition && parsed.partition !== groupFilter.partition) return false;
          if (groupFilter.status) {
            if (groupFilter.status === 'rented') {
              if (!item.is_rented) return false;
            } else if (item.status !== groupFilter.status) return false;
          }
          if (groupFilter.platform && item.platform !== groupFilter.platform) return false;
          return true;
        });
        if (filtered.length === 0) return null;
        return {
          ...g,
          listings: filtered,
          total_count: filtered.length,
          on_shelf_count: filtered.filter(i => i.status === 'on_shelf').length,
          rented_count: filtered.filter(i => i.is_rented).length,
          rented_titles: filtered.filter(i => i.is_rented).map(i => i.title.slice(0, 30)),
        };
      }).filter(g => g !== null);
    });

    async function api(url, options={}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers||{}) };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      try {
        const res = await fetch(url, { ...options, headers, body: options.body ? JSON.stringify(options.body) : undefined });
        if (res.status === 401) { token=''; localStorage.removeItem('xy_token'); page.value='login'; throw new Error('未登录'); }
        return await res.json();
      } catch(e) {
        if (e.message !== '未登录') showToast('网络错误');
        throw e;
      }
    }

    async function doLogin() {
      if (!loginForm.username || !loginForm.password) { showToast('请输入用户名和密码'); return; }
      loginLoading.value = true;
      try {
        const res = await api('/api/auth/login', { method:'POST', body: loginForm });
        if (res.access_token) {
          token = res.access_token;
          username.value = res.username;
          localStorage.setItem('xy_token', token);
          localStorage.setItem('xy_username', res.username);
          page.value = 'home';
          loadAll();
        } else {
          showToast(res.detail || '登录失败');
        }
      } catch(e) {}
      finally { loginLoading.value = false; }
    }

    function logout() {
      token=''; username.value=''; localStorage.removeItem('xy_token'); localStorage.removeItem('xy_username');
      page.value='login';
    }

    function goPage(p) {
      page.value = p;
      window.scrollTo(0, 0);
      if (p==='home') loadOverview();
      if (p==='accounts') loadAccounts();
      if (p==='orders') loadOrders();
      if (p==='stats') loadStats();
      if (p==='accountGroups') loadAccountGroups();
    }

    async function loadPlatforms() { platforms.value = await api('/api/platforms'); }
    async function loadAccounts() { accounts.value = await api('/api/accounts'); }
    async function loadOverview() { Object.assign(overview, await api('/api/stats/overview')); }
    async function loadOrders() { orders.value = await api('/api/orders?page_size=100'); }

    async function loadAll() {
      await Promise.all([loadPlatforms(), loadAccounts(), loadOverview(), loadOrders()]);
    }

    function openAccount(acc) {
      currentAccount.value = acc;
      page.value = 'accountDetail';
      loadListings();
    }

    async function loadListings() {
      if (!currentAccount.value) return;
      listings.value = await api(`/api/accounts/${currentAccount.value.id}/listings`);
    }

    async function loginAccount(acc) {
      try {
        await showConfirm('账号登录', `确定要登录「${acc.nickname||acc.platform_username}」吗？`);
        const res = await api(`/api/accounts/${acc.id}/login`, { method:'POST', body:{} });
        showToast(res.message || '登录任务已提交');
        setTimeout(()=>{ loadAccounts(); if(currentAccount.value&&currentAccount.value.id===acc.id) currentAccount.value.status='online'; }, 2000);
      } catch(e) {}
    }

    async function syncAccount(acc) {
      try {
        await api(`/api/accounts/${acc.id}/sync`, { method:'POST' });
        showToast('同步任务已启动');
        setTimeout(()=>{ loadAccounts(); loadListings(); loadOverview(); }, 3000);
      } catch(e) {}
    }

    async function toggleManage(acc) {
      try {
        await api(`/api/accounts/${acc.id}`, { method:'PUT', body:{ auto_manage: !acc.auto_manage } });
        showToast(acc.auto_manage ? '已停止托管' : '已开启托管');
        loadAccounts();
      } catch(e) {}
    }

    async function deleteAccount(acc) {
      try {
        await showConfirm('删除账号', '确定要删除这个账号吗？');
        await api(`/api/accounts/${acc.id}`, { method:'DELETE' });
        showToast('已删除');
        goPage('accounts');
      } catch(e) {}
    }

    async function listingAction(item, action) {
      try {
        const ok = await showConfirm(action==='onshelf'?'上架确认':'下架确认',
          `确定要${action==='onshelf'?'上架':'下架'}「${item.title.slice(0,30)}」吗？`);
        if (!ok) return;
        await api(`/api/accounts/${currentAccount.value.id}/listings/${item.id}/action`, { method:'POST', body:{ action } });
        showToast(action==='onshelf'?'上架成功':'下架成功');
        loadListings();
      } catch(e) {}
    }

    async function editAccountId(item) {
      const input = prompt('设置游戏账号标识（如QQ号，用于跨平台冲突检测）：', item.account_identifier || '');
      if (input === null) return;
      try {
        await api(`/api/accounts/${currentAccount.value.id}/listings/${item.id}`, { method:'PUT', body:{ account_identifier: input.trim() || null } });
        showToast(input.trim() ? '账号标识已设置' : '账号标识已清除');
        loadListings();
      } catch(e) {}
    }

    function isConflict(item) {
      if (!item.account_identifier || !item.status || item.status !== 'on_shelf') return false;
      // 检查其他账号下是否有同标识的在售商品
      for (const acc of accounts.value) {
        if (acc.id === currentAccount.value.id) continue;
        // 这里简化判断: 如果全局有同标识的ongoing订单就算冲突
      }
      // 检查是否有ongoing订单对应同标识商品
      const ongoingOrders = orders.value.filter(o => o.status === 'ongoing');
      for (const order of ongoingOrders) {
        // 通过订单标题模糊匹配商品
        if (order.listing_title && item.title) {
          const ot = order.listing_title.slice(0, 15).toLowerCase();
          const it = item.title.slice(0, 15).toLowerCase();
          if (ot && it && (ot.includes(it) || it.includes(ot))) return true;
        }
      }
      return false;
    }

    async function runConflictCheck() {
      try {
        showToast('正在检测跨平台冲突...');
        const res = await api('/api/accounts/conflict-check', { method:'POST' });
        if (res.code === 0) {
          showToast(res.message || '冲突检测完成');
          loadListings();
          loadAccounts();
          if (page.value === 'accountGroups') loadAccountGroups();
        } else {
          showToast('冲突检测失败');
        }
      } catch(e) { showToast('冲突检测失败'); }
    }

    async function loadAccountGroups() {
      try {
        accountGroups.value = await api('/api/accounts/listings/all');
      } catch(e) {}
    }

    function toggleGroup(key) {
      expandedGroups[key] = !expandedGroups[key];
    }

    async function groupListingAction(item, action) {
      try {
        const ok = await showConfirm(action==='onshelf'?'上架确认':'下架确认',
          `确定要${action==='onshelf'?'上架':'下架'}「${item.title.slice(0,30)}」吗？\n平台：${getPlatformName(item.platform)}`);
        if (!ok) return;
        await api(`/api/accounts/${item.account_id}/listings/${item.id}/action`, { method:'POST', body:{ action } });
        showToast(action==='onshelf'?'上架成功':'下架成功');
        loadAccountGroups();
        loadOverview();
      } catch(e) {}
    }

    async function editRemark(item) {
      const input = prompt('输入备注（方便自己识别，如：大号、有防沉迷、不要租给小白等）：', item.remark || '');
      if (input === null) return;
      try {
        await api(`/api/accounts/${item.account_id}/listings/${item.id}`, { method:'PUT', body:{ remark: input.trim() || null } });
        showToast(input.trim() ? '备注已保存' : '备注已清除');
        loadAccountGroups();
      } catch(e) {}
    }

    async function doAddAccount() {
      if (!addForm.platform_username) { showToast('请输入平台账号'); return; }
      try {
        await api('/api/accounts', { method:'POST', body: addForm });
        showToast('添加成功');
        showAddAccount.value = false;
        Object.assign(addForm, { platform:'uhaozu', platform_username:'', platform_password:'', nickname:'', group_name:'默认分组', auto_manage:true });
        loadAccounts();
      } catch(e) {}
    }

    async function syncAll() {
      if (!accounts.value.length) { showToast('暂无账号'); return; }
      showToast(`已触发 ${accounts.value.length} 个账号同步`);
      for (const acc of accounts.value) {
        try { await api(`/api/accounts/${acc.id}/sync`, { method:'POST' }); } catch(e) {}
      }
    }

    async function loadStats() {
      dailyStats.value = await api(`/api/stats/daily?days=${statsDays.value}`);
      const data = dailyStats.value;
      const days = data.length || 1;
      statsSummary.totalIncome = data.reduce((s,d)=>s+d.total_income,0).toFixed(2);
      statsSummary.totalOrders = data.reduce((s,d)=>s+d.total_orders,0);
      statsSummary.totalHours = data.reduce((s,d)=>s+d.total_hours,0).toFixed(1);
      statsSummary.abnormalOrders = data.reduce((s,d)=>s+d.abnormal_orders,0);
      statsSummary.avgIncome = (statsSummary.totalIncome/days).toFixed(2);
      statsSummary.avgOrders = (statsSummary.totalOrders/days).toFixed(1);
      statsSummary.avgPerOrder = statsSummary.totalOrders>0 ? (statsSummary.totalIncome/statsSummary.totalOrders).toFixed(2) : 0;
      await nextTick();
      renderCharts();
    }

    function renderCharts() {
      const dates = dailyStats.value.map(d=>d.date.slice(5));
      const incomes = dailyStats.value.map(d=>d.total_income);
      const orderCounts = dailyStats.value.map(d=>d.total_orders);

      if (incomeChart.value) {
        if (incomeChartInst) incomeChartInst.dispose();
        incomeChartInst = echarts.init(incomeChart.value);
        incomeChartInst.setOption({
          tooltip:{trigger:'axis'}, grid:{left:40,right:20,top:20,bottom:30},
          xAxis:{type:'category',data:dates,axisLabel:{fontSize:10,color:'#969799'}},
          yAxis:{type:'value',axisLabel:{fontSize:10,color:'#969799'},splitLine:{lineStyle:{color:'#f2f3f5'}}},
          series:[{data:incomes,type:'line',smooth:true,symbol:'circle',symbolSize:6,
            lineStyle:{color:'#07c160',width:2},itemStyle:{color:'#07c160'},
            areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(7,193,96,0.3)'},{offset:1,color:'rgba(7,193,96,0.02)'}])}}]
        });
      }
      if (orderChart.value) {
        if (orderChartInst) orderChartInst.dispose();
        orderChartInst = echarts.init(orderChart.value);
        orderChartInst.setOption({
          tooltip:{trigger:'axis'}, grid:{left:40,right:20,top:20,bottom:30},
          xAxis:{type:'category',data:dates,axisLabel:{fontSize:10,color:'#969799'}},
          yAxis:{type:'value',axisLabel:{fontSize:10,color:'#969799'},splitLine:{lineStyle:{color:'#f2f3f5'}}},
          series:[{data:orderCounts,type:'bar',barWidth:'50%',
            itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#1989fa'},{offset:1,color:'rgba(25,137,250,0.4)'}]),borderRadius:[4,4,0,0]}}]
        });
      }
    }

    function getPlatformIcon(key) { const p = platforms.value.find(p=>p.key===key); return p?p.icon:'📱'; }
    function getPlatformName(key) { const p = platforms.value.find(p=>p.key===key); return p?p.name:key; }
    function getStatusText(s) { return ({online:'在线',offline:'离线',error:'异常',banned:'封禁'})[s]||s; }
    function getListingStatusText(s) { return ({on_shelf:'上架中',off_shelf:'已下架',rented:'出租中',maintenance:'维护中'})[s]||s; }
    function getOrderStatusText(s) { return ({pending:'待处理',ongoing:'进行中',completed:'已完成',cancelled:'已取消',refunded:'已退款',abnormal:'异常'})[s]||s; }
    function formatTime(t) { return t ? new Date(t).toLocaleString('zh-CN') : '-'; }

    onMounted(() => {
      if (token) { page.value = 'home'; loadAll(); }
    });

    return {
      page, username, loginForm, loginLoading, doLogin, logout, goPage,
      accounts, platforms, currentAccount, listings, orders, orderFilter, orderFilters, filteredOrders,
      accountGroups, expandedGroups, loadAccountGroups, toggleGroup, groupListingAction, editRemark,
      groupFilter, gameOptions, partitionOptions, filteredAccountGroups, platformOptions,
      overview, statsDays, statDaysOptions, dailyStats, statsSummary, incomeChart, orderChart, loadStats,
      showBrowserLogin, browserSessionId, browserPlatform, browserScreenshot, browserInputText, browserLoading, browserLoadingText, browserZoom, openBrowserLogin, startBrowserLogin, browserClick, browserType, browserPressKey, browserRefresh, browserZoomIn, browserZoomOut, confirmBrowserLogin, closeBrowserLogin, showAddAccount, showPlatformPicker, addForm, doAddAccount,
      openAccount, loadListings, loginAccount, syncAccount, toggleManage, deleteAccount, listingAction, syncAll,
      editAccountId, isConflict, runConflictCheck,
      todayStr, getPlatformIcon, getPlatformName, getStatusText, getListingStatusText, getOrderStatusText, formatTime,
      toastMsg, confirmShow, confirmTitle, confirmMsg, confirmResolve
    };
  }
}).mount('#app');
</script>
</body>
</html>
