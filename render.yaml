services:
  - type: web
    name: zuhao-guanjia
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zuhao-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SCHEDULER_ENABLED
        value: "true"
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: zuhao-db
    plan: free
    databaseName: zuhao
    user: zuhao_user
